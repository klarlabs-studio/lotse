# Pull-request and main-branch checks.
#
# Correctness gates only. Nothing here runs the Graphify comparison or the
# acceptance gate: those need ~1 GB of model/corpus state and a quiet machine
# for timings (see AGENTS.md), and a shared CI runner gives neither.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref; a stale PR build gates nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    # Cargo.toml's rust-version is a promise; this is what keeps it true.
    # 1.88 is the floor set by `ignore` 0.4.33.
    name: Rust MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install 1.88 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo +1.88 check --locked --all-targets

  benchmark-integrity:
    # The Python measurement-integrity tests. Two of them check the frozen
    # corpora byte-for-byte against benchmark/queries.json and the fault
    # catalog, so the pinned snapshots are fetched rather than letting those
    # tests be skipped: a skipped integrity check that reports success is
    # worse than none.
    name: Benchmark integrity (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: uv pip install --system -r benchmark/requirements.lock
      - name: Fetch pinned corpus snapshots
        run: |
          python benchmark/fetch.py
          # fetch.py rewrites the archive receipts. Per-file SHA-256 checks in
          # the tests are the binding content check; GitHub does not guarantee
          # byte-stable tarballs, so an archive-hash change is a warning only.
          if ! git diff --quiet -- results/snapshots.json; then
            echo "::warning::Codeload archive hashes differ from results/snapshots.json; file-level hashes are still enforced by the tests"
            git checkout -- results/snapshots.json
          fi
      - run: python -m unittest discover -s benchmark -p 'test_*.py' -v
