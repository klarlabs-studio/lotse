[package]
name = "graf"
version = "0.1.0"
edition = "2024"
description = "Local, budgeted source evidence for coding agents"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
tiktoken-rs = "0.12"
