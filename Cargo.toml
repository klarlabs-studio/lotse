[package]
name = "graf"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Local, budgeted source evidence for coding agents"
keywords = ["retrieval", "bm25", "code-search", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
tiktoken-rs = "0.12"

# Tests build the cl100k tokenizer many times; unoptimized, its construction
# dominates the suite. Optimizing dependencies only keeps graf itself debuggable.
[profile.dev.package."*"]
opt-level = 2
